# Hermes example config — copy values via `hermes model` / `hermes gateway setup`.
# Model: Muse Spark 1.3 via OpenCode Go relay (OpenAI-compatible).
# Key: OPENCODE_GO_API_KEY (opencode.ai) in ~/.hermes/.env (or container env).
model:
  provider: opencode-go
  default: muse-spark-1.3-contributor

mcp_servers:
  tinyfish:
    url: https://agent.tinyfish.ai/mcp
    auth: oauth
    tools:
      include: [search, fetch]
      prompts: false
      resources: false
    sampling:
      enabled: false
  # Playwright DISABLED by default: its ~20+ browser tools cost ~8-15k tokens
  # every turn in tool schemas + keeps Chromium resident. The bot answers from
  # local data/*.json + TinyFish; it never needs a live browser.
  # Re-enable only for debugging, with a tight filter, e.g.:
  #   tools:
  #     include: [browser_navigate, browser_snapshot]
  #     prompts: false
  #     resources: false
  playwright:
    enabled: false
    command: npx
    args: ["-y", "@playwright/mcp@latest", "--headless"]
    idle_timeout_seconds: 900
    max_lifetime_seconds: 86400
    sampling:
      enabled: false

# Token-burn guards: keep per-turn usage small so the free tier never throttles.
# Wiki fetches are large: spill them to disk early so they don't ride
# along in history and get re-billed every turn.
tool_budget:
  mcp_result_size_chars: 15000

# Prune stale tool output deterministically (no LLM call) once re-sent
# history exceeds this. Keeps long auto_threads from re-billing old
# wiki dumps every turn. Cache-break is gated by min_reclaim (default 4096).
compression:
  proactive_prune_tokens: 48000

platforms:
  discord:
    enabled: true
    require_mention: true # keep true: every free reply is a full billed turn
    auto_thread: true # threads accumulate history -> TPM. Start fresh (/new) for new topics.
    # WARNING token cost: each ID here replies to EVERY message without a
    # mention (10x model calls). Keep list empty unless needed.
    free_response_channels:
      - 1547681840628764854
    # allow-all users is granted via DISCORD_ALLOW_ALL_USERS=true in .env
    # channel_prompts:
    #   "1547681840628764854": "You are the Lost Son of Managed Democracy. Serial [REDACTED]. Controlled cold rage."

terminal:
  backend: docker
