name: opencode-review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  review:
    runs-on: ubuntu-latest
    # Backstop: a permission prompt nobody can answer in CI must fail fast,
    # never hang the runner until cancellation.
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # external_directory defaults to "ask" and CI has no one to answer,
          # so the agent hung forever on its first /tmp access. Pre-approve
          # only the temp dir (inline runtime config, CI-only); every other
          # external path still asks.
          OPENCODE_CONFIG_CONTENT: '{"permission":{"external_directory":{"/tmp/*":"allow"}}}'
        with:
          model: opencode-go/muse-spark-1.3-contributor
          use_github_token: true
          prompt: |
            Review this pull request (Go project — check gofmt, go vet cleanliness, error handling, and concurrency safety):
            - Check for code quality issues
            - Look for potential bugs and security problems
            - Suggest concrete improvements
            - Post your findings as a PR comment, concise and actionable.
              If the PR is trivial or has no issues, say so briefly instead of nitpicking.
