name: go

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: fmt
        run: test -z "$(gofmt -l cmd internal souldata.go)"
      - name: vet-test-build
        run: go vet ./... && go test ./... && go build ./...
